name: build docker image

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      # ghcr rejects image names containing uppercase letters, and docker
      # tags can't contain slashes, so both get normalized here
      - name: Compute image name
        id: image
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          echo "image=ghcr.io/${REPO,,}:${REF//\//-}" >> "$GITHUB_OUTPUT"

  build-images:
    needs: [prepare]
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          file: ./Dockerfile
          tags: ${{ needs.prepare.outputs.image }}-${{ matrix.arch }}

  push-manifest:
    needs: [prepare, build-images]
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tagged manifest
        uses: int128/docker-manifest-create-action@v2
        with:
          tags: ${{ needs.prepare.outputs.image }}
          sources: |
            ${{ needs.prepare.outputs.image }}-amd64
            ${{ needs.prepare.outputs.image }}-arm64
