services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/bafandry997/egovd:main}
    # `docker compose up -d --build` builds from this source tree instead
    # of pulling, so the bot can be deployed without any registry at all
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot
    restart: unless-stopped
    networks:
      - govd-network
    env_file:
      - .env
    volumes:
      - ./private:/app/private
      - ./logs:/app/logs
      - ./downloads:/app/downloads
    ports:
      - "${METRICS_PORT-}:8080"
      - "${PROFILER_PORT-}:6060"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:latest
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: govd
      POSTGRES_USER: govd
      POSTGRES_PASSWORD: password
    volumes:
      - db:/var/lib/postgresql
    networks:
      - govd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govd"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  db:

networks:
  govd-network:
    driver: bridge